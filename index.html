<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115 西屯走讀課程｜教案地圖網站</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --main: #2f6f4f;
    --main-light: #eaf3ee;
    --accent: #d98c3f;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --border: #dde3df;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: "PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    color: var(--text);
    background: #faf9f6;
  }
  header{
    background: var(--main);
    color: #fff;
    padding: 28px 24px 20px;
    text-align:center;
  }
  header h1{ margin:0 0 6px; font-size: 1.6rem; letter-spacing: 1px; }
  header p{ margin:0; opacity:.85; font-size:.9rem; }

  nav.grade-tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    padding: 16px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position: sticky;
    top:0;
    z-index: 50;
  }
  nav.grade-tabs button{
    border:1px solid var(--main);
    background:#fff;
    color: var(--main);
    padding:8px 18px;
    border-radius: 999px;
    font-size: .95rem;
    cursor:pointer;
    transition:.15s;
  }
  nav.grade-tabs button:hover{ background: var(--main-light); }
  nav.grade-tabs button.active{
    background: var(--main);
    color:#fff;
  }

  main{ max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }

  .grade-panel{ display:none; }
  .grade-panel.active{ display:block; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  section.block{
    background:#fff;
    border:1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 22px;
  }
  section.block h2{
    margin:0 0 14px;
    font-size: 1.15rem;
    color: var(--main);
    display:flex;
    align-items:center;
    gap:8px;
  }
  section.block h2 .tag{
    font-size:.7rem;
    background: var(--main-light);
    color: var(--main);
    padding:2px 10px;
    border-radius: 999px;
    font-weight:normal;
  }

  #map{ height: 360px; border-radius: 10px; border:1px solid var(--border); }
  .map-note{ margin-top:10px; font-size:.82rem; color: var(--muted); }

  .plan-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:14px;
  }
  .plan-card{
    background: var(--main-light);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .plan-card h3{ margin:0 0 6px; font-size:.95rem; color: var(--main); }
  .plan-card p, .plan-card ul{ margin:0; font-size:.88rem; color: var(--text); line-height:1.6; }
  .plan-card ul{ padding-left: 18px; }

  .spot-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
    gap:16px;
  }
  .spot-card{
    border:1px solid var(--border);
    border-radius: 10px;
    overflow:hidden;
  }
  .spot-card .spot-img{
    height: 120px;
    background: linear-gradient(135deg, var(--main-light), #fff);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--main);
    font-size:.8rem;
  }
  .spot-card .spot-body{ padding: 12px 14px; }
  .spot-card h3{ margin:0 0 6px; font-size:.95rem; }
  .spot-card p{ margin:0; font-size:.85rem; color: var(--muted); line-height:1.6; }
  .spot-card .meta{
    margin-top:8px;
    font-size:.78rem;
    color: var(--accent);
  }

  .placeholder-note{
    font-size:.78rem;
    color: var(--muted);
    background: #fff8ef;
    border:1px dashed #e0c9a6;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:16px;
  }

  footer{
    text-align:center;
    font-size:.78rem;
    color: var(--muted);
    padding: 20px;
  }
</style>
</head>

const tabsEl = document.getElementById("gradeTabs");
const panelsEl = document.getElementById("gradePanels");
const mapInstances = {};

      <h2>走讀路線地圖 <span class="tag">${grade.label}</span></h2>
      <div id="map-${grade.id}" style="height:360px;border-radius:10px;border:1px solid var(--border);"></div>
      <p class="map-note">點擊圖釘可查看地點簡介；座標為依地址概略定位，正式帶班走讀前請再實地核對路線。</p>
    </section>

        <div class="plan-card">
          <h3>單元主題</h3>
          <p>${grade.plan.subject}</p>
        </div>
        <div class="plan-card">
          <h3>教學目標</h3>
          <ul>${grade.plan.goals.map(g => `<li>${g}</li>`).join("")}</ul>
        </div>
        <div class="plan-card">
          <h3>教學流程</h3>
          <ul>${grade.plan.flow.map(f => `<li>${f}</li>`).join("")}</ul>
        </div>
        <div class="plan-card">
          <h3>學習單</h3>
          <p>${grade.plan.worksheet}</p>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>走讀地點介紹 <span class="tag">${grade.label}</span></h2>
      <div class="spot-grid">
        ${grade.route.map(spot => `
          <div class="spot-card">
            <div class="spot-img">${spot.name}</div>
            <div class="spot-body">
              <h3>${spot.name}</h3>
              <p>${spot.desc}</p>
              <div class="meta">座標：${spot.lat.toFixed(4)}, ${spot.lng.toFixed(4)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </section>
  `;
  panelsEl.appendChild(panel);
});

function switchGrade(id) {
  document.querySelectorAll(".grade-tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.target === id);
  });
  document.querySelectorAll(".grade-panel").forEach(p => {
    p.classList.toggle("active", p.id === id);
  });
  // 確保地圖在顯示時正確渲染尺寸
  const grade = GRADES.find(g => g.id === id);
  if (grade) initMap(grade);
  setTimeout(() => {
    if (mapInstances[id]) mapInstances[id].invalidateSize();
  }, 80);
}

function initMap(grade) {
  if (mapInstances[grade.id]) return;
  const map = L.map(`map-${grade.id}`).setView(grade.center, grade.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap 貢獻者'
  }).addTo(map);

  grade.route.forEach((spot, i) => {
    L.marker([spot.lat, spot.lng]).addTo(map)
      .bindPopup(`<strong>${i + 1}. ${spot.name}</strong><br>${spot.desc}`);
  });

  // 以折線示意走讀路線
  L.polyline(grade.route.map(s => [s.lat, s.lng]), { color: "#2f6f4f", weight: 3, dashArray: "6 6" }).addTo(map);

  mapInstances[grade.id] = map;
}

// 初始化第一個年級的地圖
initMap(GRADES[0]);
</script>

</html>
